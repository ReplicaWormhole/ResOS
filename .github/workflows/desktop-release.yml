name: Build desktop release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version on the selected revision, or an exact v-prefixed release tag'
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve release revision
        id: release
        env:
          RELEASE_INPUT: ${{ inputs.release }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$RELEASE_INPUT" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Enter a version such as 1.0.0 or a tag such as v1.0.0." >&2
            exit 1
          fi
          version="${RELEASE_INPUT#v}"
          ref="$DISPATCH_SHA"
          if [[ "$RELEASE_INPUT" == v* ]]; then
            ref="refs/tags/$RELEASE_INPUT"
          fi
          printf 'version=%s\nref=%s\n' "$version" "$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.release.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Match package version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: test "$(node -p 'require("./package.json").version')" = "$RELEASE_VERSION"
      - name: Install packaging and display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils desktop-file-utils fakeroot xvfb xauth xz-utils
      - run: npm ci
      - run: npm run release:linux
      - name: Verify checksum, install, and test
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          package="resos_$RELEASE_VERSION"_amd64.deb
          (cd release && sha256sum -c "$package.sha256")
          sudo apt-get install -y "./release/$package"
          desktop-file-validate /usr/share/applications/resos.desktop
          RESOS_EXECUTABLE=/opt/ResOS/resos xvfb-run -a npm run test:desktop
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: resos-${{ steps.release.outputs.version }}-linux-x64
          path: |
            release/resos_${{ steps.release.outputs.version }}_amd64.deb
            release/resos_${{ steps.release.outputs.version }}_amd64.deb.sha256
          if-no-files-found: error
