<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'nonce-__RESOS_STYLE_NONCE__'; base-uri 'none'; form-action 'none'"
    />
    <meta name="editor-style-nonce" content="__RESOS_STYLE_NONCE__" />
    <title>ResOS</title>
    <script type="module" src="theme.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="renderer.js"></script>
  </head>
  <body>
    <aside aria-labelledby="projects-heading">
      <div id="sidebar-content">
        <div class="app-name">ResOS</div>
        <h2 id="projects-heading">Projects</h2>
        <button id="add-project" type="button" disabled>Add Project</button>
        <ul id="projects" aria-label="Saved projects"></ul>
        <section class="sidebar-section" id="files" hidden>
          <h2>
            <button
              class="disclosure"
              type="button"
              aria-controls="files-content"
              aria-expanded="true"
            >
              Files
            </button>
          </h2>
          <div id="files-content">
            <button id="refresh-files" type="button">Refresh tree</button>
            <div id="file-tree"></div>
          </div>
        </section>
        <section class="sidebar-section" id="chats" hidden>
          <h2>
            <button
              class="disclosure"
              type="button"
              aria-controls="chats-content"
              aria-expanded="true"
            >
              Chats
            </button>
          </h2>
          <button id="new-chat" type="button">New chat</button>
          <div id="chats-content">
            <ul id="chat-list" aria-label="Conversations"></ul>
            <details class="chat-context">
              <summary>Search project chats</summary>
              <label for="chat-search">Search saved context</label>
              <input id="chat-search" type="search" />
              <ul id="chat-search-results"></ul>
            </details>
            <details class="chat-context">
              <summary>File notes</summary>
              <div id="file-notes"></div>
            </details>
          </div>
        </section>
      </div>
      <footer id="appearance-controls">
        <label class="theme-setting" for="theme-toggle">
          <span>Dark mode</span>
          <input id="theme-toggle" type="checkbox" role="switch" disabled />
        </label>
      </footer>
    </aside>
    <main>
      <header>
        <h1 id="project-title">Choose a project</h1>
        <p id="project-root">Add a folder to start a project.</p>
        <div id="missing-project" hidden>
          <p>
            The project folder is unavailable. Saved chats are still available.
          </p>
          <button id="locate-project" type="button">Locate folder</button>
        </div>
      </header>
      <p id="project-error" role="alert" hidden></p>
      <div id="workspace-views" role="group" aria-label="Workspace view" hidden>
        <button type="button" data-view="chat" aria-pressed="true">Chat</button>
        <button type="button" data-view="editor" aria-pressed="false">
          Editor
        </button>
        <button type="button" data-view="split" aria-pressed="false">
          Split view
        </button>
      </div>
      <div id="workspace" data-view="chat" hidden>
        <section id="editor-pane" aria-label="Workspace editor">
          <div id="file-tabs" role="tablist" aria-label="Open files"></div>
          <p id="editor-empty">Open a text file from the project tree.</p>
          <div id="editor-document" role="tabpanel" hidden>
            <div id="editor-actions">
              <button id="save-file" type="button">Save</button>
              <button id="ask-file" type="button">Ask about saved file</button>
              <button id="find-in-file" type="button">Find</button>
              <button id="reload-file" type="button">Reload file</button>
              <button id="close-file" type="button">Close tab</button>
            </div>
            <p id="editor-status" role="status"></p>
            <div id="editor-notes"></div>
            <div id="text-editor"></div>
          </div>
          <p id="editor-error" role="alert" hidden></p>
        </section>
        <div id="chat-stage">
          <section id="parent-chat" aria-label="Parent chat" hidden></section>
          <section id="chat-pane" aria-label="Chat">
            <div id="side-chat-actions" hidden>
              <button id="side-chat-back" type="button">Back to parent</button>
              <button id="side-chat-expand" type="button">Expand</button>
            </div>
            <p id="chat-runtime" class="chat-demo" hidden></p>
            <div id="chat-approvals"></div>
            <div
              id="chat-transcript"
              aria-label="Conversation history"
              tabindex="0"
            ></div>
            <p id="chat-error" role="alert" hidden></p>
            <form id="chat-composer">
              <div id="draft-excerpts"></div>
              <label class="visually-hidden" for="chat-input">Message</label>
              <textarea
                id="chat-input"
                rows="3"
                maxlength="12000"
                placeholder="Message…"
                aria-description="Enter to send. Shift+Enter for a new line."
              ></textarea>
              <div class="composer-actions">
                <button id="preview-context" type="button">
                  Preview context
                </button>
                <label
                  id="notebook-lookup-setting"
                  title="Let this response look up excerpts across saved chats in this project."
                  hidden
                >
                  <input id="notebook-lookup" type="checkbox" />
                  Allow notebook lookup
                </label>
                <div id="run-settings" hidden>
                  <button
                    id="run-settings-toggle"
                    type="button"
                    popovertarget="run-settings-menu"
                    aria-label="Model and thinking settings"
                    aria-describedby="run-settings-summary"
                    aria-haspopup="dialog"
                    aria-expanded="false"
                  >
                    <span id="run-settings-summary">Choose model</span>
                    <span aria-hidden="true">⌄</span>
                  </button>
                  <div
                    id="run-settings-menu"
                    popover="auto"
                    role="dialog"
                    aria-label="Model and thinking settings"
                  >
                    <div class="run-settings-options">
                      <div>
                        <label for="run-model">Model</label>
                        <select id="run-model" autofocus></select>
                      </div>
                      <div>
                        <label for="run-effort">Reasoning effort</label>
                        <select id="run-effort"></select>
                      </div>
                      <div>
                        <label for="run-mode">Mode</label>
                        <select id="run-mode"></select>
                      </div>
                      <button id="refresh-models" type="button">
                        Refresh models
                      </button>
                    </div>
                    <div id="run-settings-status" role="status"></div>
                  </div>
                </div>
                <button id="chat-send" type="submit">Send</button>
              </div>
            </form>
            <p id="chat-status" role="status"></p>
          </section>
        </div>
      </div>
    </main>
    <div
      id="selection-toolbar"
      role="group"
      aria-label="Selection actions"
      hidden
    >
      <button type="button" data-action="annotate">Annotate</button>
      <button type="button" data-action="ask">Ask about selection</button>
      <button type="button" data-action="add">Add to chat</button>
    </div>
  </body>
</html>
